- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(1)
  parent_id: null
  control_name: Access Control
  level: standard
  requirement_type: required
  safeguard_category: Technical
  requirement_text: Implement technical policies and procedures for electronic information
    systems that maintain electronic protected health information to allow access
    only to those persons or software programs that have been granted access rights
    as specified in § 164.308(a)(4).
  citation: 45 CFR § 164.312(a)(1)
  in_scope_v1: true
- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(2)(i)
  parent_id: 164.312(a)(1)
  control_name: Unique User Identification
  level: implementation_specification
  requirement_type: required
  safeguard_category: Technical
  requirement_text: Assign a unique name and/or number for identifying and tracking
    user identity.
  citation: 45 CFR § 164.312(a)(2)(i)
  in_scope_v1: true
- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(2)(ii)
  parent_id: 164.312(a)(1)
  control_name: Emergency Access Procedure
  level: implementation_specification
  requirement_type: required
  safeguard_category: Technical
  requirement_text: Establish (and implement as needed) procedures for obtaining necessary
    electronic protected health information during an emergency.
  citation: 45 CFR § 164.312(a)(2)(ii)
  in_scope_v1: true
- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(2)(iii)
  parent_id: 164.312(a)(1)
  control_name: Automatic Logoff
  level: implementation_specification
  requirement_type: addressable
  safeguard_category: Technical
  requirement_text: Implement electronic procedures that terminate an electronic session
    after a predetermined time of inactivity.
  citation: 45 CFR § 164.312(a)(2)(iii)
  in_scope_v1: true
- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(2)(iv)
  parent_id: 164.312(a)(1)
  control_name: Encryption and Decryption
  level: implementation_specification
  requirement_type: addressable
  safeguard_category: Technical
  requirement_text: Implement a mechanism to encrypt and decrypt electronic protected
    health information.
  citation: 45 CFR § 164.312(a)(2)(iv)
  in_scope_v1: true
- framework: HIPAA
  section: '164.308'
  control_id: 164.308(a)(2)
  parent_id: null
  control_name: Assigned Security Responsibility
  level: standard
  requirement_type: required
  safeguard_category: Administrative
  requirement_text: Identify the security official who is responsible for the development
    and implementation of the policies and procedures required by this subpart for
    the covered entity or business associate.
  citation: 45 CFR § 164.308(a)(2)
  in_scope_v1: true
- framework: HIPAA
  section: '164.308'
  control_id: 164.308(a)(6)(i)
  parent_id: null
  control_name: Security Incident Procedures
  level: standard
  requirement_type: required
  safeguard_category: Administrative
  requirement_text: Implement policies and procedures to address security incidents.
  citation: 45 CFR § 164.308(a)(6)(i)
  in_scope_v1: true
- framework: HIPAA
  section: '164.308'
  control_id: 164.308(a)(6)(ii)
  parent_id: 164.308(a)(6)(i)
  control_name: Response and Reporting
  level: implementation_specification
  requirement_type: required
  safeguard_category: Administrative
  requirement_text: Identify and respond to suspected or known security incidents;
    mitigate, to the extent practicable, harmful effects of security incidents that
    are known to the covered entity or business associate; and document security incidents
    and their outcomes.
  citation: 45 CFR § 164.308(a)(6)(ii)
  in_scope_v1: true
- framework: HIPAA
  section: '164.308'
  control_id: 164.308(a)(8)
  parent_id: null
  control_name: Evaluation
  level: standard
  requirement_type: required
  safeguard_category: Administrative
  requirement_text: Perform a periodic technical and nontechnical evaluation, based
    initially upon the standards implemented under this rule and, subsequently, in
    response to environmental or operational changes affecting the security of electronic
    protected health information, that establishes the extent to which a covered entity's
    or business associate's security policies and procedures meet the requirements
    of this subpart.
  citation: 45 CFR § 164.308(a)(8)
  in_scope_v1: true
