- framework: HIPAA
  section: '164.312'
  control_id: 164.312(a)(1)
  parent_id: null
  control_name: Access Control
  level: standard
  requirement_type: required
  safeguard_category: Technical
  requirement_text: Implement technical policies and procedures for electronic information
    systems that maintain electronic protected health information to allow access
    only to those persons or software programs that have been granted access rights
    as specified in § 164.308(a)(4).
  citation: 45 CFR § 164.312(a)(1)
  in_scope_v1: true
